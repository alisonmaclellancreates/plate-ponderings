name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test with coverage
        run: bun run test:coverage
      - name: Summarize coverage
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          bun -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const metrics = ["statements", "branches", "functions", "lines"];
            const rows = metrics.map(metric => `| ${metric} | ${total[metric].pct}% |`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## Coverage", "", "| Metric | Total |", "| --- | ---: |", ...rows, ""
            ].join("\n"));
          '
      - name: Preserve coverage reports
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
